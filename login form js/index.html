<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login form task</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

        <div class="formSection">

            <div class="formInput">

                <h1>Login</h1>

                <form onsubmit="submitHandle(event)">

                    <p><label for="email">Email</label></p>
                    <input type="text" id="email" placeholder="Enter Your Email Here">

                    <p><label for="pass">Password</label></p>
                    <input type="text" id="pass" placeholder="Enter Your Password Here">

                    <p class="forgotPass"><a href="#">Forgot Password?</a></p>

                    <button>Submit</button>

                </form>

            </div>

            <div class="formimg">
                <img src="./89e31fb982e6d87f239196db2b3e9ccc copy 1.png" alt="">
            </div>

        </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
